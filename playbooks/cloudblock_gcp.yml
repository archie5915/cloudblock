---
- name: Cloudblock - google cloud x86_64 variant
  hosts: localhost
  gather_facts: true
  become: true
  tasks:

    - name: DNSCrypt resolver mapping
      ansible.builtin.set_fact:
        dnscrypt_resolver_from_doh_provider:
          cloudflare-security: cloudflare-security

    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - doh_provider is defined
          - doh_provider in dnscrypt_resolver_from_doh_provider
          - dns_novpn is defined
          - dns_novpn in ['0', '1']
          - vpn_traffic is not defined or vpn_traffic in ['dns', 'peers', 'all']
          - wireguard_peers is defined
          - wireguard_peers | int >= 1
        fail_msg: >-
          Invalid configuration. Check doh_provider, dns_novpn,
          vpn_traffic, and wireguard_peers.
        success_msg: Deployment variables are valid.

    - name: Create directory for Docker's GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Remove legacy Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent

    - name: Remove legacy Docker apt repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: Dpkg Architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Configure Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts["distribution_release"] }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Absent packages
      ansible.builtin.apt:
        pkg:
          - containerd
          - docker-compose
          - docker-doc
          - docker.io
          - podman-docker
          - runc
        state: absent

    - name: Required packages
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - containerd.io
          - cron
          - curl
          - dnsutils
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
          - gnupg
          - libcap2-bin
          - ssl-cert
        state: present
        update_cache: true

    - name: Ensure cron service is enabled and running
      ansible.builtin.systemd:
        name: cron
        state: started
        enabled: true

    - name: Create Snap cleanup script
      ansible.builtin.copy:
        dest: /usr/local/sbin/cloudblock-clean-snap.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail

          if ! command -v snap >/dev/null 2>&1; then
              exit 0
          fi

          /usr/bin/snap list --all |
              /usr/bin/awk '/disabled/{print $1, $3}' |
              while read -r snapname revision; do
                  /usr/bin/snap remove "$snapname" --revision="$revision"
              done

    - name: Schedule weekly Docker cleanup
      ansible.builtin.cron:
        name: "Cloudblock - Docker system prune"
        user: root
        minute: "0"
        hour: "3"
        weekday: "0"
        job: "/usr/bin/docker system prune -f"

    - name: Schedule weekly reboot
      ansible.builtin.cron:
        name: "Cloudblock - weekly reboot"
        user: root
        minute: "0"
        hour: "4"
        weekday: "0"
        job: "/usr/bin/systemctl reboot"

    - name: Schedule weekly Snap cleanup
      ansible.builtin.cron:
        name: "Cloudblock - Snap cleanup"
        user: root
        minute: "0"
        hour: "15"
        weekday: "1"
        job: "/usr/local/sbin/cloudblock-clean-snap.sh"

    - name: IP Forwarding enable/persist
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true
        sysctl_set: true
        sysctl_file: /etc/sysctl.conf

    - name: Docker service started/enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Pi-hole directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'
      loop:
        - /opt/pihole
        - /opt/pihole/etc

    - name: Wireguard dir gets user ubuntu
      ansible.builtin.file:
        path: /opt/wireguard
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0750'

    - name: Retrieve GCS Token
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
        method: GET
        headers:
          Metadata-Flavor: Google
        return_content: true
      register: gcs_token_resp
      no_log: true

    - name: Determine wireguard state
      ansible.builtin.stat:
        path: /opt/wireguard/server
      register: wireguard_state

    - name: Check if wireguard backup exists in GCS
      ansible.builtin.uri:
        url: https://storage.googleapis.com/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/wireguard/wireguard_backup.tar.gz
        method: HEAD
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
        status_code:
          - 200
          - 404
        timeout: 120
      register: wireguard_backup_check
      when: not wireguard_state.stat.exists

    - name: Download wireguard backup
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/wireguard/wireguard_backup.tar.gz
        timeout: 120
        owner: root
        group: root
        mode: '0640'
        dest: /opt/wireguard_backup.tar.gz
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
      when:
        - not wireguard_state.stat.exists
        - wireguard_backup_check.status == 200

    - name: Restore wireguard backup
      ansible.builtin.unarchive:
        src: /opt/wireguard_backup.tar.gz
        dest: /opt/
        remote_src: true
        owner: '1000'
      when:
        - not wireguard_state.stat.exists
        - wireguard_backup_check.status == 200

    - name: Determine pihole directory state
      ansible.builtin.stat:
        path: /opt/pihole/etc/pihole-FTL.db
      register: pihole_state

    - name: Check if pihole backup exists in GCS
      ansible.builtin.uri:
        url: https://storage.googleapis.com/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/pihole/pihole_backup.tar.gz
        method: HEAD
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
        status_code:
          - 200
          - 404
        timeout: 120
      register: pihole_backup_check
      when: not pihole_state.stat.exists

    - name: Download pihole backup
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/pihole/pihole_backup.tar.gz
        timeout: 120
        owner: root
        group: root
        mode: '0640'
        dest: /opt/pihole_backup.tar.gz
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
      when:
        - not pihole_state.stat.exists
        - pihole_backup_check.status == 200

    - name: Restore pihole backup
      ansible.builtin.unarchive:
        src: /opt/pihole_backup.tar.gz
        dest: /opt/
        remote_src: true
        owner: '1000'
      when:
        - not pihole_state.stat.exists
        - pihole_backup_check.status == 200

#Match Docker network MTU with the GCP VPC and VM interface.
    - name: Cloudblock Docker network
      community.docker.docker_network:
        name: cloudblock
        driver: bridge
        driver_options:
          com.docker.network.driver.mtu: 1500
        ipam_config:
          - subnet: "{{ docker_network }}/24"
            gateway: "{{ docker_gw }}"

    - name: DNSCrypt-proxy directory
      ansible.builtin.file:
        path: /opt/dnscrypt-proxy
        state: directory
        owner: "65532"
        group: "65532"
        mode: '0755'

    - name: DNSCrypt-proxy configuration
      ansible.builtin.copy:
        dest: /opt/dnscrypt-proxy/dnscrypt-proxy.toml
        owner: "65532"
        group: "65532"
        mode: '0644'
        content: |
          server_names = ['{{ dnscrypt_resolver_from_doh_provider[doh_provider] }}']

          listen_addresses = ['0.0.0.0:5053']

          ipv4_servers = true
          ipv6_servers = false

          dnscrypt_servers = false
          doh_servers = true
          odoh_servers = false

          require_dnssec = true
          require_nolog = true

          force_tcp = false
          timeout = 5000
          keepalive = 30

          bootstrap_resolvers = ['9.9.9.11:53', '8.8.8.8:53']
          ignore_system_dns = true

          netprobe_timeout = 60
          netprobe_address = '9.9.9.9:53'

          cache = true
          cache_size = 4096

          [sources]

            [sources.public-resolvers]
            urls = [
              'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
              'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md'
            ]
            cache_file = 'public-resolvers.md'
            minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
            refresh_delay = 73
            prefix = ''

    - name: Remove legacy cloudflared DoH container
      community.docker.docker_container:
        name: cloudflared_doh
        state: absent

    - name: DNSCrypt-proxy container
      community.docker.docker_container:
        name: dnscrypt-proxy
        image: "klutchell/dnscrypt-proxy@sha256:a98e8d13314fa8b75620026441b1d6581e2b55189509a794500c5c86064df810"
        networks:
          - name: cloudblock
            ipv4_address: "{{ docker_doh }}"
        volumes:
          - /opt/dnscrypt-proxy:/config:rw
        pull: true
        restart_policy: "always"

    - name: Pihole container - without DNS listen
      community.docker.docker_container:
        name: pihole
        hostname: cloudblockpihole
        env:
          FTLCONF_dns_upstreams: "{{ docker_doh }}#5053"
          FTLCONF_webserver_api_password: ""
          FTLCONF_dns_listeningMode: "ALL"
        image: pihole/pihole:2026.07.2
        networks:
          - name: cloudblock
            ipv4_address: "{{ docker_pihole }}"
        ports:
          - "443:443"
        volumes:
          - /opt/pihole/etc:/etc/pihole/:rw
        pull: true
        restart_policy: "always"
      when: dns_novpn == "0"
      no_log: true

    - name: Pihole container - with DNS listen
      community.docker.docker_container:
        name: pihole
        hostname: cloudblockpihole
        env:
          FTLCONF_dns_upstreams: "{{ docker_doh }}#5053"
          FTLCONF_webserver_api_password: ""
          FTLCONF_dns_listeningMode: "ALL"
        image: pihole/pihole:2026.07.2
        networks:
          - name: cloudblock
            ipv4_address: "{{ docker_pihole }}"
        ports:
          - "53:53"
          - "53:53/udp"
          - "443:443"
        volumes:
          - /opt/pihole/etc:/etc/pihole/:rw
        pull: true
        restart_policy: "always"
      when: dns_novpn == "1"
      no_log: true

    - name: Set WireGuard allowed IPs
      ansible.builtin.set_fact:
        wireguard_allowed_ips: >-
          {{
            {
              'dns': docker_pihole ~ '/32',
              'peers': docker_pihole ~ '/32,' ~ wireguard_network ~ '/24',
              'all': '0.0.0.0/0'
            }.get(
              vpn_traffic | default('dns'),
              docker_pihole ~ '/32'
            )
          }}

    - name: Wireguard container
      community.docker.docker_container:
        name: wireguard
        capabilities:
          - NET_ADMIN
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Etc/UTC"
          SERVERURL: "auto"
          SERVERPORT: "51820"
          ALLOWEDIPS: "{{ wireguard_allowed_ips }}"
          PEERS: "{{ wireguard_peers }}"
          PEERDNS: "{{ docker_pihole }}"
          INTERNAL_SUBNET: "{{ wireguard_network }}"
          LOG_CONFS: "false"
        image: linuxserver/wireguard:1.0.20260223-r0-ls119
        networks:
          - name: cloudblock
            ipv4_address: "{{ docker_wireguard }}"
        ports:
          - "51820:51820/udp"
        sysctls:
          net.ipv4.conf.all.src_valid_mark: 1
        volumes:
          - /opt/wireguard:/config:rw
        pull: true
        restart_policy: "always"

    - name: Verify DNSCrypt-proxy DNS resolution
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ docker_doh }}"
          - -p
          - "5053"
          - google.com
          - +short
          - +time=5
          - +tries=1
      register: dnscrypt_dns_check
      changed_when: false
      retries: 6
      delay: 5
      until:
        - dnscrypt_dns_check.rc == 0
        - dnscrypt_dns_check.stdout | length > 0

    - name: Verify Pi-hole DNS resolution
      ansible.builtin.command:
        argv:
          - dig
          - "@{{ docker_pihole }}"
          - google.com
          - +short
          - +time=5
          - +tries=1
      register: pihole_dns_check
      changed_when: false
      retries: 6
      delay: 5
      until:
        - pihole_dns_check.rc == 0
        - pihole_dns_check.stdout | length > 0

    - name: Verify WireGuard interface
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - wireguard
          - wg
          - show
          - wg0
      register: wireguard_health_check
      changed_when: false
      retries: 6
      delay: 5
      until: wireguard_health_check.rc == 0

    - name: Set peer count list
      ansible.builtin.set_fact:
        peer_count: "{{ range(1, wireguard_peers | int + 1) | list }}"

    - name: Wait for WireGuard public keys
      ansible.builtin.wait_for:
        path: "/opt/wireguard/peer{{ item }}/publickey-peer{{ item }}"
        state: present
        timeout: 600
        sleep: 1
      loop: "{{ peer_count }}"

    - name: Wait for WireGuard private keys
      ansible.builtin.wait_for:
        path: "/opt/wireguard/peer{{ item }}/privatekey-peer{{ item }}"
        state: present
        timeout: 600
        sleep: 1
      loop: "{{ peer_count }}"

    - name: Wait for WireGuard configs
      ansible.builtin.wait_for:
        path: "/opt/wireguard/peer{{ item }}/peer{{ item }}.conf"
        state: present
        timeout: 600
        sleep: 1
      loop: "{{ peer_count }}"

    - name: Wait for WireGuard QR codes
      ansible.builtin.wait_for:
        path: "/opt/wireguard/peer{{ item }}/peer{{ item }}.png"
        state: present
        timeout: 600
        sleep: 1
      loop: "{{ peer_count }}"

    - name: Upload wireguard to google bucket - conf
      ansible.builtin.uri:
        url: https://storage.googleapis.com/upload/storage/v1/b/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/o?uploadType=media&name=wireguard/peer{{ item }}/peer{{ item }}.conf
        timeout: 720
        method: POST
        src: /opt/wireguard/peer{{ item }}/peer{{ item }}.conf
        remote_src: true
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
          Content-Type: text/plain
      loop: "{{ peer_count }}"

    - name: Archive wireguard
      community.general.archive:
        path: /opt/wireguard
        dest: /opt/wireguard_backup.tar.gz
        format: gz
        owner: root
        group: root
        mode: '0640'

    - name: Refresh GCS Token before wireguard uploads
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
        method: GET
        headers:
          Metadata-Flavor: Google
        return_content: true
      register: gcs_token_resp
      no_log: true

    - name: Upload wireguard backup archive
      ansible.builtin.uri:
        url: https://storage.googleapis.com/upload/storage/v1/b/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/o?uploadType=media&name=wireguard/wireguard_backup.tar.gz
        timeout: 720
        method: POST
        src: /opt/wireguard_backup.tar.gz
        remote_src: true
        headers:
          Authorization: Bearer {{ gcs_token_resp.json.access_token }}
          Content-Type: application/gzip

    - name: Remove local WireGuard backup archive
      ansible.builtin.file:
        path: /opt/wireguard_backup.tar.gz
        state: absent

    - name: Create Pi-hole backup playbook
      ansible.builtin.copy:
        dest: /opt/pihole-to-backup.yml
        owner: root
        group: root
        mode: '0640'
        content: |
          ---
          - name: pihole-backup.yml
            hosts: localhost
            gather_facts: false

            tasks:
              - name: Create consistent Pi-hole backup
                block:
                  - name: Stop Pi-hole container
                    community.docker.docker_container:
                      name: pihole
                      state: stopped

                  - name: Archive Pi-hole locally
                    community.general.archive:
                      path: /opt/pihole
                      dest: /opt/pihole_backup.tar.gz
                      format: gz
                      owner: root
                      group: root
                      mode: '0640'

                always:
                  - name: Start Pi-hole container
                    community.docker.docker_container:
                      name: pihole
                      state: started

              - name: Retrieve GCS Token
                ansible.builtin.uri:
                  url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
                  method: GET
                  headers:
                    Metadata-Flavor: Google
                  return_content: true
                register: gcs_token_response
                no_log: true

              - name: Upload pihole backup archive
                ansible.builtin.uri:
                  url: https://storage.googleapis.com/upload/storage/v1/b/{{ gcp_project_prefix }}-bucket-{{ gcp_project_suffix }}/o?uploadType=media&name=pihole/pihole_backup.tar.gz
                  timeout: 720
                  method: POST
                  src: /opt/pihole_backup.tar.gz
                  remote_src: true
                  headers:
                    Authorization: Bearer {{ '{{' }} gcs_token_response.json.access_token {{ '}}' }}
                    Content-Type: application/gzip

              - name: Remove local Pi-hole backup archive
                ansible.builtin.file:
                  path: /opt/pihole_backup.tar.gz
                  state: absent

    - name: Pihole to backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/pihole-to-backup.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Archives and copies pihole to cloud storage

          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=12h
          Persistent=true
          Unit=pihole-to-backup.service

          [Install]
          WantedBy=timers.target

    - name: Pihole to backup service
      ansible.builtin.copy:
        dest: /etc/systemd/system/pihole-to-backup.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Archives and copies pihole to backup
          After=network.target

          [Service]
          ExecStart=/opt/ansible-venv/bin/ansible-playbook /opt/pihole-to-backup.yml
          Type=simple
          Restart=no

    - name: Disable direct pihole backup service startup
      ansible.builtin.systemd:
        name: pihole-to-backup.service
        enabled: false

    - name: Enable and start pihole backup timer
      ansible.builtin.systemd:
        name: pihole-to-backup.timer
        daemon_reload: true
        state: started
        enabled: true
